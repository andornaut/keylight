name: Release

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
    # Release versions only, the same set protect-release-tags guards.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Write access is granted per job rather than here: `contents` to the job that
# creates releases, `id-token` to the job that publishes to the registry.
permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Publishing waits on the scan as well: a release is a durable artifact, and
  # taking an attribution back off after one is cut means rewriting history that
  # has already been published. Called only where a release can follow, since
  # the scan workflow already runs on every push and pull request of its own
  # accord.
  attributions:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ai-attributions.yml

  # Publishing waits on the same checks that guard main, rather than on the
  # build alone: something that packages cleanly still ships whatever the checks
  # would have caught. Called only where a release can follow, since the Test
  # workflow already runs on every push and pull request of its own accord.
  test:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml

  # Runs on every push and pull request, not only on a tag: a build that is
  # first attempted at release time is a build whose breakage is found with the
  # version already cut.
  build:
    name: Build
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      # The registry carries what the manifest declares, not what the tag says.
      # A manifest behind its tag is caught by the registry refusing a version
      # it already has; one ahead of its tag publishes successfully, under a
      # version no tag names and with nothing to say so. protect-release-tags
      # has no bypass, so a tag cut against the wrong manifest cannot be moved
      # to match afterwards: the next version number is the only way out.
      #
      # In build rather than beside the publish, so a mismatch fails before
      # there is an artifact, a GitHub release or a registry upload.
      - name: The declared version must name this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          # An extraction that returned nothing is a format that moved, which
          # must fail rather than compare an empty string and look like a match.
          if [ -z "$version" ]; then
            echo "::error::no version found in pyproject.toml"
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::pyproject.toml declares $version, but this tag is $TAG"
            exit 1
          fi

      - name: Build the distribution
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_SHA:?CI requires its expected source commit}"
          ci_revision=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse HEAD)
          ci_status=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain=v1 --untracked-files=all)
          if [[ ${ci_revision} != "${GITHUB_SHA}" || -n ${ci_status} ]]; then
            printf '%s\n' 'CI requires the clean expected source commit.' >&2
            exit 125
          fi
          if [[ ! ${GITHUB_SHA} =~ ^[a-f0-9]{40}$ ]]; then
            printf '%s\n' 'CI requires a full expected commit SHA.' >&2
            exit 125
          fi
          ci_control_blob=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse --verify "${GITHUB_SHA}:tests/container/stock")
          ci_control_entry=$(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null ls-tree "${GITHUB_SHA}" -- tests/container/stock)
          if [[ ( ${ci_control_entry} != "100644 blob ${ci_control_blob}"$'\t'"tests/container/stock" && ${ci_control_entry} != "100755 blob ${ci_control_blob}"$'\t'"tests/container/stock" ) || ! -f tests/container/stock || -L tests/container/stock || ( ${ci_control_entry} == 100644* && -x tests/container/stock ) || ( ${ci_control_entry} == 100755* && ! -x tests/container/stock ) || $(git hash-object --no-filters -- tests/container/stock) != "${ci_control_blob}" ]]; then
            printf '%s\n' 'CI stock control source differs from the expected regular blob.' >&2
            exit 125
          fi
          source tests/container/stock
          stock_begin "$PWD"
          if [[ ${revision} != "${GITHUB_SHA}" || ${source_dirty} != false ]]; then
            printf '%s\n' 'CI source changed before snapshot capture.' >&2
            exit 125
          fi
          stock_image native_image "python:$(cat .python-version)"
          publish_package() (
              set -euo pipefail
              target=dist
              kind=python
              generated=${scratch}/build-output
              stage=
              backup=
              stage_identity=
              backup_identity=
              old_identity=
              publication_identity() {
                  if [[ -d $1 && ! -L $1 ]]; then stat -c '%d:%i' -- "$1"; fi
              }
              # The cleanup trap calls this helper.
              # shellcheck disable=SC2329
              publication_remove_owned() {
                  path=$1
                  identity=$2
                  if [[ ! -e ${path} && ! -L ${path} ]]; then return 0; fi
                  if [[ -z ${identity} || $(publication_identity "${path}") != "${identity}" || -n $(find -P "${path}" -type l -print -quit) ]]; then
                      printf 'Preserve changed publication path: %s/%s\n' "${checkout}" "${path}" >&2
                      return 125
                  fi
                  find -P "${path}" -depth -delete
              }
              # EXIT and signal traps call this callback.
              # shellcheck disable=SC2329
              publication_cleanup() {
                  result=$?
                  trap - EXIT INT TERM HUP
                  set +e
                  if (( result != 0 )); then
                      if [[ -n ${stage_identity} && $(publication_identity "${target}") == "${stage_identity}" && ! -e ${stage} && ! -L ${stage} ]]; then
                          mv -T --no-clobber -- "${target}" "${stage}"
                          if [[ $(publication_identity "${stage}") != "${stage_identity}" ]]; then result=125; fi
                      fi
                      if [[ -n ${old_identity} && -n ${backup} && $(publication_identity "${backup}") == "${old_identity}" ]]; then
                          if [[ ! -e ${target} && ! -L ${target} ]]; then
                              mv -T --no-clobber -- "${backup}" "${target}"
                              if [[ $(publication_identity "${target}") != "${old_identity}" || -e ${backup} || -L ${backup} ]]; then result=125; fi
                          else
                              printf 'Preserve concurrent output and recover original from: %s/%s\n' "${checkout}" "${backup}" >&2
                              result=125
                          fi
                      fi
                  fi
                  if [[ -n ${stage} ]]; then publication_remove_owned "${stage}" "${stage_identity}" || result=125; fi
                  if [[ -n ${backup} && ( -e ${backup} || -L ${backup} ) ]]; then
                      if (( result == 0 )); then
                          publication_remove_owned "${backup}" "${old_identity}" || result=125
                      elif [[ $(publication_identity "${backup}") == "${backup_identity}" ]]; then
                          publication_remove_owned "${backup}" "${backup_identity}" || result=125
                      fi
                  fi
                  exit "${result}"
              }
              trap publication_cleanup EXIT
              trap 'exit 130' INT
              trap 'exit 143' TERM
              trap 'exit 129' HUP
              [[ $(pwd -P) == "${checkout}" && $(realpath -e -- "${checkout}") == "${checkout}" ]]
              [[ -d ${generated} && ! -L ${generated} && $(stat -c %u -- "${generated}") == "$(id -u)" ]]
              git_control=(git --no-optional-locks -c core.fsmonitor=false -c core.hooksPath=/dev/null)
              validate_target() {
                  [[ ! -L ${target} && ( ! -e ${target} || -d ${target} ) ]]
                  current_head=$("${git_control[@]}" rev-parse HEAD)
                  [[ ${current_head} == "${revision}" ]]
                  index_entries=$("${git_control[@]}" ls-files -- "${target}")
                  head_entries=$("${git_control[@]}" ls-tree -r --name-only HEAD -- "${target}")
                  [[ -z ${index_entries} && -z ${head_entries} ]]
                  "${git_control[@]}" check-ignore --quiet --no-index "${target}/"
                  if [[ -e ${target} ]]; then
                      find -P "${target}" -print0 > "${scratch}/package-existing.list"
                      while IFS= read -r -d '' entry; do
                          [[ ! -L ${entry} && ( -f ${entry} || -d ${entry} ) ]]
                          "${git_control[@]}" check-ignore --quiet --no-index "${entry}"
                      done < "${scratch}/package-existing.list"
                  fi
              }
              validate_target
              find -P "${generated}" -mindepth 1 -print0 > "${scratch}/package-generated.list"
              wheels=0
              sources=0
              gems=0
              while IFS= read -r -d '' entry; do
                  [[ -f ${entry} && ! -L ${entry} && $(dirname -- "${entry}") == "${generated}" && $(stat -c %h -- "${entry}") == 1 ]]
                  name=${entry##*/}
                  [[ ${name} =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]]
                  case "${kind}:${name}" in
                      python:*.whl) wheels=$((wheels + 1)) ;;
                      python:*.tar.gz) sources=$((sources + 1)) ;;
                      ruby:*.gem) gems=$((gems + 1)) ;;
                      *) printf 'Unexpected package output: %s\n' "${name}" >&2; exit 2 ;;
                  esac
                  "${git_control[@]}" check-ignore --quiet --no-index "${target}/${name}"
              done < "${scratch}/package-generated.list"
              if [[ ${kind} == python ]]; then
                  [[ ${wheels} == 1 && ${sources} == 1 && ${gems} == 0 ]]
              else
                  [[ ${gems} == 1 && ${wheels} == 0 && ${sources} == 0 ]]
              fi
              stage=$(mktemp -d ".${target}-stage.XXXXXXXX")
              stage_identity=$(stat -c '%d:%i' -- "${stage}")
              cp -R -- "${generated}/." "${stage}/"
              find -P "${stage}" -type d -exec chmod u+rwx,go+rx,go-w {} +
              find -P "${stage}" -type f -exec chmod u+rw,go+r,go-w {} +
              validate_target
              if [[ -e ${target} ]]; then
                  old_identity=$(publication_identity "${target}")
                  backup=$(mktemp -d ".${target}-backup.XXXXXXXX")
                  backup_identity=$(publication_identity "${backup}")
                  [[ $(publication_identity "${target}") == "${old_identity}" && $(publication_identity "${backup}") == "${backup_identity}" ]]
                  mv -T -- "${target}" "${backup}"
              fi
              mv -T --no-clobber -- "${stage}" "${target}"
              [[ ! -e ${stage} && ! -L ${stage} && $(publication_identity "${target}") == "${stage_identity}" ]]
          )
          build_output=${scratch}/build-output
          mkdir "${build_output}"
          STOCK_OUTPUT_DIR=${build_output} STOCK_NETWORK=bridge stock_run "${native_image}" -- sh -ec 'python -m venv /scratch/venv >&2
          /scratch/venv/bin/python -m pip install --disable-pip-version-check poetry==2.5.1 >&2
          export VIRTUAL_ENV=/scratch/venv PATH="/scratch/venv/bin:$PATH" POETRY_VIRTUALENVS_CREATE=false
          poetry install --no-root >&2
          export VIRTUAL_ENV=/scratch/venv PATH="/scratch/venv/bin:$PATH"
          export POETRY_VIRTUALENVS_CREATE=false
          result=0
          poetry build --output /outputs || result=$?
          find /outputs -mindepth 1 -type d -exec chmod a+rwx {} +
          exit "$result"
          '
          stock_finish
          publish_package

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*

  # Tags only, with no rolling `dev` release beside it, unlike the other
  # repositories here. A wheel takes its version from its filename and pip reads
  # it back from there, so a dev cut cannot reuse one asset name the way an
  # archive of a binary does: every version bump would leave the wheel before it
  # in place, since an upload replaces only a file it can match by name. The
  # install route is `pipx install keylight` against PyPI, so a rolling wheel
  # here would have no consumer to justify that.
  release:
    needs: [build, test, attributions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The job that writes `contents`. The publish job below writes nothing but
    # its own `id-token`.
    permissions:
      contents: write

    steps:
      # No checkout: the assets come from the build job, and the notes below are
      # generated from the tag by GitHub rather than read out of the tree.
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: artifacts

      # This release is what identifies the commit the archives were built
      # from; the publish job below sends that same pair on to PyPI. The
      # version is only ever cut from a tag, so the notes and the latest marker
      # are unconditional.
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          files: artifacts/*

  # Behind `release` rather than beside it, so the tag and the GitHub release
  # naming a version exist before PyPI carries it; a version cannot be taken
  # back off PyPI the way a GitHub release can be edited. Gated on a tag like
  # every job above, this repository having no rolling `dev` cut to exclude.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # id-token is the whole credential: the step below exchanges this job's OIDC
    # claim for a short-lived PyPI API token, so nothing long-lived is stored
    # as a secret. The trusted publisher registered on pypi.org names this
    # repository and this workflow file, so renaming either stops the publish
    # until it is renamed there too. No environment is named here, so the one
    # on pypi.org stays empty as well.
    permissions:
      contents: read
      id-token: write

    steps:
      # No checkout, as in the job above: what is uploaded is the pair the build
      # job produced, and nothing here is read out of the tree.
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          # `dist/` because that is where gh-action-pypi-publish looks unless
          # told otherwise. Unpacking the build job's artifact here is what
          # makes the sdist and wheel PyPI receives the same two files the
          # GitHub release carries, rather than a second build of one version.
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
