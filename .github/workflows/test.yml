name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run native lint
        shell: bash
        run: |
          set -euo pipefail
          source tests/container/stock
          stock_begin "$PWD"
          STOCK_OUTPUT_DIR=
          native_image="python:$(cat .python-version)"
          STOCK_NETWORK=bridge stock_run "${native_image}" -- sh -ec 'python -m venv /scratch/venv >&2
          /scratch/venv/bin/python -m pip install --disable-pip-version-check poetry==2.5.1 >&2
          export VIRTUAL_ENV=/scratch/venv PATH="/scratch/venv/bin:$PATH" POETRY_VIRTUALENVS_CREATE=false
          poetry install --no-root >&2
          export VIRTUAL_ENV=/scratch/venv PATH="/scratch/venv/bin:$PATH"
          export POETRY_VIRTUALENVS_CREATE=false
          for script in tests/container/stock tests/container/check-stock; do bash -n "$script"; done
          for script in tests/container/python tests/container/markdown; do sh -n "$script"; done
          bash
          ruff check .
          ruff format --check .
          '
          stock_finish

      - name: Lint Markdown
        shell: bash
        run: |
          set -euo pipefail
          source tests/container/stock
          stock_begin "$PWD"
          STOCK_OUTPUT_DIR=
          markdown_image=node:24.22.2
          STOCK_NETWORK=bridge stock_run "${markdown_image}" -- sh -ec 'mkdir -p /scratch/markdown
          cp tests/container/package.json tests/container/package-lock.json /scratch/markdown/
          npm ci --prefix /scratch/markdown --ignore-scripts --no-audit --no-fund --maxsockets=1 >&2
          exec /scratch/markdown/node_modules/.bin/markdownlint-cli2
          '
          stock_finish

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail
          source tests/container/stock
          stock_begin "$PWD"
          STOCK_OUTPUT_DIR=
          shellcheck_image=koalaman/shellcheck:v0.11.0
          stock_readonly "${shellcheck_image}" /bin/shellcheck -x -P SCRIPTDIR tests/container/stock tests/container/check-stock tests/container/python tests/container/markdown
          stock_finish
