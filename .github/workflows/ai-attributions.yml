name: AI attributions

# Every branch, not just pull requests: work lands on main directly as often as
# it arrives through one.
on:
  push:
    branches: ["**"]
  pull_request:
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green scan beside a
  # release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same scan
# twice. Keyed by the calling workflow as well, so the run started by a push
# and the run the release workflow calls do not cancel each other. Qualified by
# the repository the branch lives in, since a fork names its branches itself: a
# pull request from a fork's main would otherwise share a group with a push to
# this one and cancel it.
concurrency:
  group: attributions-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ai-attributions:
    name: AI attributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Scans what the push or the pull request added, not the history it
      # arrived on, and fails with the commands to take an attribution back off.
      - name: Scan for AI attributions
        uses: andornaut/ai-attributions@v1
        with:
          # Agent instruction files are local-only, so a branch that ships one
          # fails here rather than waiting for a nightly sweep to notice.
          agents-files: true
